version: "2"
sql:
  - engine: "postgresql"
    # Schema is derived from the goose migrations; sqlc understands goose
    # up/down annotations and ignores rollback statements.
    schema: "migrations"
    queries: "internal/repo/queries"
    gen:
      go:
        package: "sqlc"
        out: "internal/repo/sqlc"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_interface: true
        emit_empty_slices: true
        emit_pointers_for_null_types: true
        overrides:
          - db_type: "timestamptz"
            go_type: "time.Time"
          - db_type: "timestamptz"
            nullable: true
            go_type:
              import: "github.com/jackc/pgx/v5/pgtype"
              type: "Timestamptz"
