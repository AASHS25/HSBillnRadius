# Production override for deploy/docker-compose.yml.
# Usage:
#   docker compose --env-file deploy/.env \
#     -f deploy/docker-compose.yml -f deploy/docker-compose.prod.yml \
#     --profile app up --build -d
#
# Differences vs the base (dev) compose:
#   - APP_ENV=production and secrets/DSN injected from deploy/.env
#   - Postgres/Redis are NOT published to the host (internal network only)
#   - restart: unless-stopped on every service
#   - API not published either: front it with the edge proxy (see Caddyfile.example)
name: billing-radius

services:
  postgres:
    ports: !reset [] # do not expose the database to the host in production
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}

  redis:
    ports: !reset []
    restart: unless-stopped

  migrate:
    environment:
      POSTGRES_DSN: ${POSTGRES_DSN:?set POSTGRES_DSN in deploy/.env}

  api:
    restart: unless-stopped
    ports: !reset [] # publish via the edge proxy, not directly
    expose:
      - "8080"
    environment:
      APP_ENV: production
      POSTGRES_DSN: ${POSTGRES_DSN:?set POSTGRES_DSN in deploy/.env}
      REDIS_ADDR: ${REDIS_ADDR:-redis:6379}
      JWT_SECRET: ${JWT_SECRET:?set a 32+ char JWT_SECRET in deploy/.env}
      ACS_BASE_URL: ${ACS_BASE_URL:-}
      COMMISSION_RATE_BPS: ${COMMISSION_RATE_BPS:-500}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-json}

  radius:
    restart: unless-stopped
    environment:
      APP_ENV: production
      POSTGRES_DSN: ${POSTGRES_DSN:?set POSTGRES_DSN in deploy/.env}
      REDIS_ADDR: ${REDIS_ADDR:-redis:6379}
      JWT_SECRET: ${JWT_SECRET:?set a 32+ char JWT_SECRET in deploy/.env}

  worker:
    restart: unless-stopped
    environment:
      APP_ENV: production
      POSTGRES_DSN: ${POSTGRES_DSN:?set POSTGRES_DSN in deploy/.env}
      REDIS_ADDR: ${REDIS_ADDR:-redis:6379}
      JWT_SECRET: ${JWT_SECRET:?set a 32+ char JWT_SECRET in deploy/.env}

  scheduler:
    restart: unless-stopped
    environment:
      APP_ENV: production
      POSTGRES_DSN: ${POSTGRES_DSN:?set POSTGRES_DSN in deploy/.env}
      REDIS_ADDR: ${REDIS_ADDR:-redis:6379}
      JWT_SECRET: ${JWT_SECRET:?set a 32+ char JWT_SECRET in deploy/.env}
      COMMISSION_RATE_BPS: ${COMMISSION_RATE_BPS:-500}

  # Edge reverse proxy: terminates HTTPS and forwards to the API.
  edge:
    image: caddy:2-alpine
    profiles: ["app"]
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
